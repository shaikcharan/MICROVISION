<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration - Microvision : Automated Cell Identification</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f7fc;
      color: #333;
      margin: 0;
      background-image:
        url('https://media.istockphoto.com/id/1013435204/photo/businessman-filling-online-registration-form.jpg?s=612x612&w=0&k=20&c=OqVxHQngPfPHNV9baIcqChpiL7Iv5G86bK5Pg0urbTc=');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .navbar {
      background: linear-gradient(rgba(255, 255, 255, 0.9),
          rgba(255, 255, 255, 0.9)),
        url('https://images.unsplash.com/photo-1625772452859-1c03d2bf1137?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
      padding: 1.2rem 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar-brand h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #005f99;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-link {
      font-size: 1.1rem;
      font-weight: 500;
      color: #333;
      padding: 10px 20px;
      border-radius: 25px;
      transition: all 0.3s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background-color: #007bff;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a href="/" class="navbar-brand p-0">
        <h1 class="display-6 text-primary" style="font-size: 25px;">
          Microvision
        </h1>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
        <span class="fa fa-bars"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarCollapse">
        <div class="navbar-nav py-0">
          <a href="/" class="nav-item nav-link mx-2">Home</a>
          <a href="/register" class="nav-item nav-link active mx-2">Registration</a>
          <a href="/login" class="nav-item nav-link mx-2">Login</a>
        </div>
      </div>
    </div>
  </nav>
  {% if message %}
  <div id="message"
    style="background-color: hsl(355, 70%, 91%); color: #26721c; padding: 15px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; text-align: center; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
    {{ message }}
  </div>
  {% endif %}
  <!-- Registration Form -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 shadow">
          <h4 class="card-title mb-4 text-center">Create an Account</h4>
          <form action="/register" method="POST">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" name="username" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" required />
            </div>
            <div class="mb-3">
              <label for="c_password" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="c_password" name="c_password" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">
              Register
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container text-center py-3">
      <p>© 2025 Microvision: Automated Cell Identification Project. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
