<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Microvison </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7fc;
            color: #333;
            margin: 0;
        }

        .navbar {
            background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)),
                url('https://images.unsplash.com/photo-1625772452859-1c03d2bf1137?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #005f99;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-link {
            font-size: 1.1rem;
            font-weight: 500;
            color: #333;
            padding: 10px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #fff;
            background-color: #007bff;
        }

        .footer {
            background-color: #1a252f;
            color: white;
            padding: 30px 0;
            text-align: center;
        }

        .footer p {
            margin: 0;
            font-size: 1rem;
            font-weight: 300;
        }
    </style>
</head>

<body
    style="background-image: url('https://media.istockphoto.com/id/1337837834/photo/internet-security-concept-user-access-login-and-password-on-computer.jpg?s=612x612&w=0&k=20&c=i3VoS04kybZm_4wF65DbajxknMRzipO0yeRVypV-99I='); background-repeat: no-repeat; background-size: cover;">
    <!-- Navbar -->
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <!-- Left-aligned project title -->
            <a href="/" class="navbar-brand p-0">
                <h1 class="display-6 text-primary" style="font-size: 25px;">Microvision</h1>
            </a>

            <!-- Navbar toggle button for mobile view -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="fa fa-bars"></span>
            </button>

            <!-- Right-aligned navbar contents -->
            <div class="collapse navbar-collapse" id="navbarCollapse" style="position: relative; left: 300px;">
                <div class="navbar-nav ml-auto py-0">
                    <a href="/" class="nav-item nav-link active mx-2">Home</a>

                    <a href="/register" class="nav-item nav-link mx-2">Registration</a>
                    <a href="/login" class="nav-item nav-link mx-2">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <br><br>
    {% if message %}
    <div id="message"
        style="background-color: hsl(355, 70%, 91%); color: #26721c; padding: 15px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; text-align: center; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
        {{ message }}
    </div>
    {% endif %}
    <!-- Login Form -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow">
                    <h4 class="card-title mb-4 text-center">Login to Your Account</h4>
                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2025 Microvision: Automated Cell Identification Project. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
